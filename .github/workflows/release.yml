name: Release

# Push a tag like v0.2.0 to publish a release. The binary is built here in
# CI (never on a developer machine), with SHA-256 checksums and a signed
# build-provenance attestation, so anyone can check that a download came
# from this repository's workflow:
#
#   gh attestation verify brickle-*-x86_64-linux.tar.gz --repo raztocky/gale
#
# Brickle never updates itself or checks for updates (see PRIVACY.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time; never cancel a release half-way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    # The oldest supported Ubuntu LTS image keeps glibc compatibility wide
    # (Linux Mint 21 and newer).
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache here on purpose: a poisoned cache must never end up in
      # a published binary.
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: System libraries for the window
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Test
        run: cargo test --locked --release
      - name: Build
        run: cargo build --locked --release
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="brickle-${TAG}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/brickle README.md PRIVACY.md SECURITY.md "dist/$name/"
          cp assets/fonts/LICENSE-DejaVu.txt "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Brickle $TAG" --verify-tag \
            --notes "Built by GitHub Actions from $GITHUB_SHA. Verify with: gh attestation verify <file> --repo $GITHUB_REPOSITORY"

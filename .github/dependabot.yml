# Dependabot opens pull requests to update dependencies and the pinned
# action commits. Nothing is merged automatically; CI runs on every PR.
# Each update waits 7 days after release (cooldown): compromised releases
# are usually caught and pulled within that window.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

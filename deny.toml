# cargo-deny: run `cargo deny check` locally; CI runs it on every push.

[graph]
all-features = true

[advisories]
# Fail on any RustSec vulnerability or unsound advisory; warn on unmaintained.
yanked = "deny"
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
# Brickle itself has no license chosen yet; it is publish = false.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

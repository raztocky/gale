[package]
name = "brickle"
version = "0.1.0"
edition = "2021"
description = "A tiny web browser engine written from scratch"
publish = false

[features]
default = ["gui"]
gui = ["dep:minifb", "dep:arboard"]

[dependencies]
png = "0.18"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
# Certificate revocation (CRLite) filters, and the SHA-256 that keys them.
clubcard-crlite = { version = "0.6", default-features = false }
ring = "0.17"
serde_json = "1"
# JavaScript engine: pure Rust interpreter, no JIT. Runs only in the sandboxed renderer.
boa_engine = { version = "0.22", default-features = false, features = ["annex-b"] }
ureq = { version = "2", features = ["native-certs", "gzip", "brotli"] }
minifb = { version = "0.29", optional = true }
psl = "2.1.246"
flate2 = "1.1.10"
ruzstd = "0.9.1"
unicode-linebreak = "0.1.5"
# Image decoders (pure Rust). Images are decoded in disposable sandboxed workers (unless --no-sandbox).
zune-jpeg = "0.5.15"
gif = { version = "0.14.2", default-features = false, features = ["std"] }
image-webp = "0.2.4"
# SVG images (shapes only: no text, no embedded images, no files).
resvg = { version = "0.49", default-features = false, features = ["text"] }
usvg = { version = "0.49", default-features = false, features = ["text"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
roxmltree = "0.21"
arboard = { version = "3.7.0", default-features = false, optional = true }
skrifa = "0.49"
harfrust = "0.15"

# The renderer sandbox (Landlock + seccomp + rlimits) is Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"
rlimit = "0.11.0"
libc = "0.2.191"
nix = { version = "0.31.3", default-features = false, features = ["sched", "user"] }

[profile.dev]
opt-level = 1

[dev-dependencies]
# A TLS server with a self-signed certificate, for tests/privacy.rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# ureq 2.12.1 with a fix for a panic on malformed response headers (see
# vendor/ureq/BRICKLE.md). Goes away with the move to ureq 3.
[patch.crates-io]
ureq = { path = "vendor/ureq" }

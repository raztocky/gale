[package]
name = "brickle"
version = "0.1.0"
edition = "2021"
description = "A tiny web browser engine written from scratch"
publish = false

[features]
default = ["gui"]
gui = ["dep:minifb"]

[dependencies]
fontdue = "0.9"
png = "0.17"
url = "2"
ureq = { version = "2", features = ["native-certs", "gzip", "brotli"] }
minifb = { version = "0.27", optional = true }
psl = "2.1.246"
flate2 = "1.1.10"
ruzstd = "0.9.1"
unicode-linebreak = "0.1.5"
read-fonts = "0.46.0"

# The renderer sandbox (Landlock + seccomp + rlimits) is Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"
rlimit = "0.11.0"
libc = "0.2.191"
nix = { version = "0.31.3", default-features = false, features = ["sched", "user"] }

[profile.dev]
opt-level = 1
